<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaslam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        nav {
            padding: 20px 8%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        nav h2 {
            letter-spacing: 4px;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 70px;
            letter-spacing: 10px;
        }

        .hero p {
            color: #888;
            margin-top: 20px;
            font-size: 18px;
        }

        .button {
            margin-top: 30px;
            padding: 14px 30px;
            border: 1px solid #555;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: black;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #555;
        }
    </style>
</head>

<body>

    <nav>
        <h2>YASLAM</h2>
    </nav>

    <section class="hero">
        <h1>YASLAM</h1>

        <p>Welcome to my website.</p>

        <a class="button" href="#">
            Explore
        </a>
    </section>

    <footer>
        © 2026 Yaslam
    </footer>

</body>
</html>
